<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      /* 字体来自本 skill fonts/ 目录（模板位于 reference/templates/cover-card/，向上三级到 skill 根）。
         拷贝模板到工作区使用时，把字体一并复制或改路径。 */
      @font-face {
        font-family: "ZCOOL QingKe HuangYou";
        src: url("../../../fonts/ZCOOLQingKeHuangYou.ttf");
        font-weight: 400;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px; overflow: hidden;
        background: #05070f;
        font-family: "ZCOOL QingKe HuangYou", sans-serif;
      }
      #root { position: relative; width: 100%; height: 100%; }

      /* ---- 科技底：数据流蓝 + 网格 + 霓虹光斑 ---- */
      #bg {
        position: absolute; inset: 0;
        background:
          radial-gradient(90% 55% at 50% 0%, #0d2438 0%, rgba(13,36,56,0) 70%),
          radial-gradient(70% 40% at 50% 100%, #101c3a 0%, rgba(16,28,58,0) 75%),
          linear-gradient(180deg, #060a16 0%, #0a1226 50%, #05070f 100%);
      }
      #grid {
        position: absolute; inset: 0; opacity: 0.55;
        background-image:
          linear-gradient(rgba(46,160,255,0.2) 1px, transparent 1px),
          linear-gradient(90deg, rgba(46,160,255,0.2) 1px, transparent 1px);
        background-size: 72px 72px;
        mask-image: radial-gradient(90% 70% at 50% 45%, #000 35%, transparent 100%);
      }
      .streak {
        position: absolute; height: 3px; border-radius: 999px;
        background: linear-gradient(90deg, transparent, #37e0ff, transparent);
        opacity: 0.75;
      }
      #s1 { top: 17%;  left: -10%; width: 55%; }
      #s2 { top: 64%;  right: -8%; width: 48%; }
      #s3 { top: 84%;  left: 5%;   width: 38%; opacity: 0.45; }
      .orb {
        position: absolute; border-radius: 50%; filter: blur(70px);
      }
      #o1 { width: 520px; height: 520px; left: -180px; top: 8%;  background: rgba(23,110,220,0.5); }
      #o2 { width: 460px; height: 460px; right: -160px; top: 55%; background: rgba(20,190,120,0.34); }
      #o3 { width: 420px; height: 420px; left: -120px; bottom: -60px; background: rgba(30,130,255,0.4); }
      #o4 { width: 380px; height: 380px; right: -110px; top: 22%; background: rgba(30,150,255,0.38); }

      /* ---- 标题区：海报级大字，逐词混排+粗描边+3D挤出+同色泛光 ---- */
      #title-wrap {
        position: absolute; top: 150px; left: 0; right: 0;
        display: flex; flex-direction: column; align-items: center; gap: 2px;
        z-index: 3;
      }
      .t-line { line-height: 1.08; text-align: center; white-space: nowrap; }
      .t-line .w {
        display: inline-block; font-family: "ZCOOL QingKe HuangYou", sans-serif;
        font-weight: 400;
        -webkit-text-stroke: 16px #04101e;
        paint-order: stroke fill;
        letter-spacing: 0.015em;
        text-shadow:
          0 4px 0 #041019, 0 8px 0 #041019, 0 12px 0 #041019,
          0 16px 0 #041019, 0 20px 0 #041019,
          0 30px 40px rgba(0, 0, 0, 0.75),
          0 0 34px var(--glow, rgba(255,255,255,0.35));
      }
      .c-white { color: #ffffff; --glow: rgba(150, 215, 255, 0.5); }
      .c-green { color: #45f26b; --glow: rgba(69, 242, 107, 0.75); }
      .c-gold  { color: #ffd21e; --glow: rgba(255, 210, 30, 0.75); }

      /* ---- 编号霓虹徽章卡 ---- */
      #badges {
        position: absolute; top: 990px; left: 0; right: 0;
        display: flex; flex-direction: column; align-items: center; gap: 36px;
        z-index: 3;
      }
      .bd {
        display: flex; align-items: center; gap: 26px;
        background: linear-gradient(180deg, rgba(8,26,30,0.92), rgba(6,18,26,0.92));
        border: 5px solid #35e86e;
        border-radius: 28px;
        padding: 26px 54px 26px 30px;
        box-shadow: 0 0 34px rgba(53,232,110,0.45), inset 0 0 22px rgba(53,232,110,0.18);
      }
      .bd:nth-child(1) { transform: translateX(-96px) rotate(-2deg); }
      .bd:nth-child(2) { transform: translateX(70px) rotate(1.6deg); }
      .bd:nth-child(3) { transform: translateX(-40px) rotate(-1.2deg); }
      .bd .num {
        width: 96px; height: 96px; border-radius: 26px; flex: none;
        display: flex; align-items: center; justify-content: center;
        font-size: 60px; font-weight: 400; color: #052012;
        background: linear-gradient(160deg, #6bff97, #23d45c);
        box-shadow: 0 0 24px rgba(80,255,140,0.6);
      }
      .bd .tx { font-family: "ZCOOL QingKe HuangYou", sans-serif; font-weight: 400; font-size: 64px; color: #eafff0; letter-spacing: 0.02em; }
      .bd .tx b { color: #ffd21e; }

      /* ---- 底部主体位（参考图人物位 → 主题徽标/产品位，按需替换） ---- */
      #hero {
        position: absolute; bottom: 90px; left: 0; right: 0;
        display: flex; flex-direction: column; align-items: center; gap: 30px;
        z-index: 2;
      }
      #orb-ball {
        width: 185px; height: 185px; border-radius: 50%;
        background:
          radial-gradient(circle at 34% 30%, #b6ffcf 0%, #2fe07a 34%, #0a7f43 72%, #04331c 100%);
        box-shadow: 0 0 90px rgba(53,232,110,0.75), 0 0 160px rgba(53,232,110,0.35);
        display: flex; align-items: center; justify-content: center;
        font-size: 96px;
      }
      #hero .tag {
        font-size: 54px; font-weight: 400; color: #baf7ff;
        text-shadow: 0 0 22px rgba(55,224,255,0.8);
        letter-spacing: 0.12em;
      }
      #vignette {
        position: absolute; inset: 0; z-index: 4; pointer-events: none;
        background: radial-gradient(120% 100% at 50% 50%, transparent 62%, rgba(0,0,0,0.55) 100%);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="3"
      data-width="1080"
      data-height="1920"
    >
      <div id="bg" class="clip" data-start="0" data-duration="3" data-track-index="0">
        <div id="o1" class="orb"></div>
        <div id="o2" class="orb"></div>
        <div id="o3" class="orb"></div>
        <div id="o4" class="orb"></div>
        <div id="grid"></div>
        <div id="s1" class="streak"></div>
        <div id="s2" class="streak"></div>
        <div id="s3" class="streak"></div>
      </div>

      <!-- 封面主体：首帧（t=0）即为完整封面，无入场动画。
           ⚠️ 封面元素禁用 GSAP from()/fromTo()（immediateRender 会在 t=0 抹掉元素）；
              动效统一从 0.8s 后用 to() 接管。改标题只动 .t-line 内 .w 文本与 font-size。 -->
      <div id="title-wrap" class="clip" data-start="0" data-duration="3" data-track-index="1">
        <div class="t-line">
          <span class="w c-white" style="font-size:142px">国庆</span><span class="w c-green" style="font-size:186px">别挤了</span>
        </div>
        <div class="t-line">
          <span class="w c-white" style="font-size:150px">这</span><span class="w c-gold" style="font-size:196px">3个</span><span class="w c-green" style="font-size:186px">小城</span>
        </div>
        <div class="t-line">
          <span class="w c-white" style="font-size:186px">人少</span><span class="w c-gold" style="font-size:196px">景美</span>
        </div>
      </div>

      <div id="badges" class="clip" data-start="0" data-duration="3" data-track-index="2">
        <div class="bd"><span class="num">1</span><span class="tx"><b>门票免费</b> 停车5块</span></div>
        <div class="bd"><span class="num">2</span><span class="tx">高铁<b>1.5h</b>直达</span></div>
        <div class="bd"><span class="num">3</span><span class="tx">人均<b>300</b>玩三天</span></div>
      </div>

      <div id="hero" class="clip" data-start="0" data-duration="3" data-track-index="3">
        <div id="orb-ball">🌾</div>
        <div class="tag">收 藏 备 用</div>
      </div>

      <div id="vignette"></div>

      <script>
        const tl = gsap.timeline({ paused: true });

        // 0-0.8s：封面静止（首帧即封面，ffmpeg -ss 0 抽帧窗口）
        tl.to("#title-wrap", { scale: 1.045, duration: 0.9, yoyo: true, repeat: 1, ease: "sine.inOut" }, 0.8);
        tl.to("#badges .bd", { scale: 1.07, duration: 0.35, stagger: 0.28, yoyo: true, repeat: 1, ease: "power2.inOut" }, 0.9);
        tl.to("#s1", { x: 900, duration: 1.6, ease: "none" }, 0.8);
        tl.to("#s2", { x: -800, duration: 1.7, ease: "none" }, 0.9);
        tl.to("#s3", { x: 700, duration: 1.5, ease: "none" }, 1.0);
        tl.to("#orb-ball", { scale: 1.12, duration: 0.5, yoyo: true, repeat: 2, ease: "sine.inOut" }, 1.1);
        tl.to("#root", { opacity: 0, duration: 0.35 }, 2.65);

        // 渲染器靠 window.__timelines 发现时间线；不注册 = 45s 超时后按静态帧渲染
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
        tl.seek(0);
      </script>
    </div>
  </body>
</html>
