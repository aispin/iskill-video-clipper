<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      /* ═══════════════════════════════════════════════════════════
         封面卡 v14（三段式 · 定稿配方）· 完整设计规范见 reference/cover-style-guide.md
         结构：①冲击力标题（优设标题黑） ②5张编号卖点卡弧形半包围 ③实景出镜主体（羽化无边框）
         改动点（3处）：
           a. assets/bg.jpg   —— 实景背景（ffmpeg 从素材视频抽帧，命令见 style-guide §5）
           b. assets/hero.jpg —— 出镜主体（与背景分图！真人或真物）
           c. 标题三行 .t-line 文案 + 5 张 .bd 卖点卡文案/图标
         字体：标题=优设标题黑；卡文案=庞门正道标题体（均已本地化进 assets/，免费商用）。
           v14 定稿原版卡文案用 Hiragino Sans GB（macOS 系统字体，版权原因不入仓库），
           如需还原：把 /System/Library/Fonts/Hiragino Sans GB.ttc 复制到 assets/ 并在下方
           @font-face 用 format("collection") 声明，再把 .tx/.num 的 font-family 换回。
         ═══════════════════════════════════════════════════════════ */
      @font-face {
        font-family: "YouSheBiaoTiHei";
        src: url("assets/YouSheBiaoTiHei.ttf");
        font-weight: 400;
      }
      @font-face {
        font-family: "PangMenZhengDao";
        src: url("assets/PangMenZhengDaoBiaoTiTi.ttf");
        font-weight: 400;
      }
      /* 系统字体兜底：local() 声明即满足 lint，无字体文件 */
      @font-face {
        font-family: "Hiragino Sans GB";
        src: local("Hiragino Sans GB");
      }
      @font-face {
        font-family: "PingFang SC";
        src: local("PingFang SC");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px; overflow: hidden;
        background: #05070f;
        font-family: "PangMenZhengDao", "Hiragino Sans GB", "PingFang SC", sans-serif;
      }
      #root { position: relative; width: 100%; height: 100%; }

      /* ---- 第一段底：实景背景（bg.jpg）+ 上下暗化压边（保证白字可读） ---- */
      #bg { position: absolute; inset: 0; }
      #bg img.bgimg {
        position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: cover; filter: saturate(1.15) brightness(0.9);
      }
      #bg .shade {
        position: absolute; inset: 0;
        background:
          linear-gradient(180deg, rgba(3,8,18,0.82) 0%, rgba(3,8,18,0.30) 30%, rgba(3,8,18,0.32) 55%, rgba(3,8,18,0.86) 100%),
          radial-gradient(120% 90% at 50% 40%, transparent 55%, rgba(0,0,0,0.5) 100%);
      }
      .streak {
        position: absolute; height: 3px; border-radius: 999px;
        background: linear-gradient(90deg, transparent, #37e0ff, transparent);
        opacity: 0.75;
      }
      #s1 { top: 14%;  left: -10%; width: 55%; }
      #s2 { top: 56%;  right: -8%; width: 48%; }
      #s3 { top: 90%;  left: 5%;   width: 38%; opacity: 0.45; }

      /* ═══ 第一段：冲击力标题（优设标题黑 · 逐词混排+16px描边+3D挤出） ═══ */
      #title-wrap {
        position: absolute; top: 140px; left: 0; right: 0;  /* 安全区上沿 y140 */
        display: flex; flex-direction: column; align-items: center; gap: 0;
        z-index: 3;
      }
      .t-line { line-height: 1.02; text-align: center; white-space: nowrap; }
      .t-line .w {
        display: inline-block; font-family: "YouSheBiaoTiHei", sans-serif;
        font-weight: 400;
        -webkit-text-stroke: 18px #04101e;
        paint-order: stroke fill;
        letter-spacing: 0.01em;
        text-shadow:
          0 4px 0 #041019, 0 8px 0 #041019, 0 12px 0 #041019,
          0 16px 0 #041019, 0 20px 0 #041019,
          0 30px 40px rgba(0, 0, 0, 0.75),
          0 0 34px var(--glow, rgba(255,255,255,0.35));
      }
      .c-white { color: #ffffff; --glow: rgba(150, 215, 255, 0.5); }
      .c-green { color: #45f26b; --glow: rgba(69, 242, 107, 0.75); }
      .c-gold  { color: #ffd21e; --glow: rgba(255, 210, 30, 0.75); }

      /* ═══ 第二段：5 张编号卖点卡（短文案+内联SVG图标，弧形半包围主体）
         序号规则（定稿）：顶中=1 / 二排左2右3 / 底排左4右5
         张角规则：二排 ±10° 内边上翘，底排反向 ±5° 展开（2-4 / 3-5 呈 X 形张角） ═══ */
      .bd {
        position: absolute; width: 340px; z-index: 4;
        background: rgba(5, 20, 16, 0.68);            /* 半透明磨砂：隐约透出背景 */
        backdrop-filter: blur(7px);
        -webkit-backdrop-filter: blur(7px);
        border: 5px solid #35e86e;
        border-radius: 30px;
        padding: 20px 22px 16px;
        box-shadow: 0 0 34px rgba(53,232,110,0.4), inset 0 0 22px rgba(53,232,110,0.14);
      }
      .bd .row { display: flex; align-items: center; gap: 16px; }
      .bd .num {
        width: 62px; height: 62px; border-radius: 18px; flex: none;
        display: flex; align-items: center; justify-content: center;
        font-size: 42px; color: #052012;
        font-family: "PangMenZhengDao", "Hiragino Sans GB", sans-serif; font-weight: 400;
        background: linear-gradient(160deg, #6bff97, #23d45c);
        box-shadow: 0 0 20px rgba(80,255,140,0.6);
      }
      .bd .tx {
        font-family: "PangMenZhengDao", "Hiragino Sans GB", sans-serif; font-weight: 400;
        font-size: 50px; color: #eafff0; letter-spacing: 0.02em; white-space: nowrap;
        text-shadow: 0 3px 10px rgba(0,0,0,0.85), 0 0 6px rgba(0,0,0,0.6);
      }
      .bd .tx b { color: #ffd21e; }
      .bd .ic { height: 104px; display: flex; align-items: center; justify-content: center; margin-top: 10px; }
      .bd .ic svg { height: 96px; width: auto;
        filter: drop-shadow(0 0 14px rgba(150,255,200,0.5)); }
      /* 弧形排布（安全区 y140-1790 内） */
      #bd3 { top: 785px;  left: 50%; transform: translateX(-50%) rotate(-1.5deg); }
      #bd2 { top: 875px;  left: 18px;  transform: rotate(-10deg); transform-origin: 50% 50%; }
      #bd4 { top: 875px;  right: 18px; transform: rotate(10deg);  transform-origin: 50% 50%; }
      #bd1 { top: 1120px; left: 58px; transform: rotate(5deg); }
      #bd5 { top: 1120px; right: 58px; transform: rotate(-5deg); }

      /* ═══ 第三段：出镜主体（hero.jpg，与背景分图）
         无边框 + 径向蒙版羽化（边缘融进背景）+ 顶部暗化渐变（护住上压的半透明卡文字）
         top 995 = 顶到中卡（#bd3）底部；不出下安全区 y1790 ═══ */
      #hero {
        position: absolute; top: 995px; left: 50%; transform: translateX(-50%);
        width: 730px; z-index: 3;
        -webkit-mask-image: radial-gradient(ellipse 70% 72% at 50% 50%, #000 55%, rgba(0,0,0,0.5) 78%, transparent 98%);
        mask-image: radial-gradient(ellipse 70% 72% at 50% 50%, #000 55%, rgba(0,0,0,0.5) 78%, transparent 98%);
        filter: saturate(1.1);
      }
      #hero img { display: block; width: 100%; }
      #hero .shade {
        position: absolute; inset: 0;
        background: linear-gradient(180deg, rgba(3,8,18,0.72) 0%, rgba(3,8,18,0.30) 30%, rgba(3,8,18,0) 55%, rgba(3,8,18,0.55) 100%);
      }
      #vignette {
        position: absolute; inset: 0; z-index: 6; pointer-events: none;
        background: radial-gradient(120% 100% at 50% 50%, transparent 62%, rgba(0,0,0,0.55) 100%);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="3"
      data-width="1080"
      data-height="1920"
    >
      <!-- 改动点 a：实景背景（与主体分图） -->
      <div id="bg" class="clip" data-start="0" data-duration="3" data-track-index="0">
        <img class="bgimg" src="assets/bg.jpg" alt="" />
        <div class="shade"></div>
        <div id="s1" class="streak"></div>
        <div id="s2" class="streak"></div>
        <div id="s3" class="streak"></div>
      </div>

      <!-- 封面主体：首帧（t=0）即为完整封面，无入场动画。
           ⚠️ 封面元素禁用 GSAP from()/fromTo()（immediateRender 会在 t=0 抹掉元素）；
              动效统一从 0.8s 后用 to() 接管。改标题只动 .t-line 内 .w 文本与 font-size。 -->
      <!-- 改动点 c-1：标题三行 -->
      <div id="title-wrap" class="clip" data-start="0" data-duration="3" data-track-index="1">
        <div class="t-line">
          <span class="w c-white" style="font-size:158px">国庆</span><span class="w c-gold" style="font-size:206px">别挤了</span>
        </div>
        <div class="t-line">
          <span class="w c-white" style="font-size:150px">这</span><span class="w c-gold" style="font-size:200px">3个</span><span class="w c-green" style="font-size:196px">小城</span>
        </div>
        <div class="t-line">
          <span class="w c-white" style="font-size:200px">人少</span><span class="w c-green" style="font-size:210px">景美</span>
        </div>
      </div>

      <!-- 改动点 c-2：5 张卖点卡（文案 + 内联SVG图标；⚠️ 禁用 emoji，headless Chrome 无彩色 emoji 字体） -->
      <div id="badges" class="clip" data-start="0" data-duration="3" data-track-index="2">
        <div class="bd" id="bd1">
          <div class="row"><span class="num">4</span><span class="tx"><b>门票</b>免费</span></div>
          <div class="ic"><svg viewBox="0 0 96 64" fill="none"><path d="M6 14a8 8 0 0 1 8-8h68a8 8 0 0 1 8 8v8a10 10 0 0 0 0 20v8a8 8 0 0 1-8 8H14a8 8 0 0 1-8-8v-8a10 10 0 0 0 0-20v-8Z" fill="#eafff0"/><path d="M38 10v44M46 10v44" stroke="#0a4d28" stroke-width="4" stroke-dasharray="6 7"/><path d="m62 22 3.2 6.5 7.2 1-5.2 5 1.2 7.1-6.4-3.4-6.4 3.4 1.2-7.1-5.2-5 7.2-1L62 22Z" fill="#23d45c"/></svg></div>
        </div>
        <div class="bd" id="bd2">
          <div class="row"><span class="num">2</span><span class="tx">高铁<b>1.5h</b></span></div>
          <div class="ic"><svg viewBox="0 0 96 64" fill="none"><path d="M18 4h60a10 10 0 0 1 10 10v26a10 10 0 0 1-10 10H18A10 10 0 0 1 8 40V14A10 10 0 0 1 18 4Z" fill="#eafff0"/><rect x="18" y="14" width="60" height="16" rx="4" fill="#0a4d28"/><rect x="18" y="14" width="60" height="16" rx="4" fill="#37e0ff" opacity="0.85"/><path d="m14 54-8 8M82 54l8 8" stroke="#eafff0" stroke-width="6" stroke-linecap="round"/><circle cx="26" cy="42" r="4" fill="#0a4d28"/><circle cx="70" cy="42" r="4" fill="#0a4d28"/></svg></div>
        </div>
        <div class="bd" id="bd3">
          <div class="row"><span class="num">1</span><span class="tx">人均<b>300</b></span></div>
          <div class="ic"><svg viewBox="0 0 96 64" fill="none"><path d="M38 8h20l-6 10h-8L38 8Z" fill="#ffd21e"/><path d="M30 20h36c8 10 12 20 12 28 0 9-13 14-30 14S18 57 18 48c0-8 4-18 12-28Z" fill="#ffd21e"/><text x="48" y="49" text-anchor="middle" font-size="28" font-weight="900" fill="#0a4d28" font-family="sans-serif">¥</text></svg></div>
        </div>
        <div class="bd" id="bd4">
          <div class="row"><span class="num">3</span><span class="tx">人少<b>景美</b></span></div>
          <div class="ic"><svg viewBox="0 0 96 64" fill="none"><circle cx="70" cy="16" r="9" fill="#ffd21e"/><path d="m6 56 24-34 16 22 10-14 34 26H6Z" fill="#eafff0"/></svg></div>
        </div>
        <div class="bd" id="bd5">
          <div class="row"><span class="num">5</span><span class="tx">美食管够</span></div>
          <div class="ic"><svg viewBox="0 0 96 64" fill="none"><path d="M44 6h4v22h-4V6ZM56 2h4v26h-4V2Z" fill="#eafff0"/><path d="M10 32h76c0 16-12 26-30 28v6H40v-6C22 58 10 48 10 32Z" fill="#eafff0"/><path d="M18 40h60c-3 9-13 14-30 14S21 49 18 40Z" fill="#23d45c"/></svg></div>
        </div>
      </div>

      <!-- 改动点 b：出镜主体（教程类=真人 / 产品类=真物；与背景分图） -->
      <div id="hero" class="clip" data-start="0" data-duration="3" data-track-index="3">
        <img src="assets/hero.jpg" alt="" />
        <div class="shade"></div>
      </div>

      <div id="vignette"></div>

      <script>
        const tl = gsap.timeline({ paused: true });

        // 0-0.8s：封面静止（首帧即封面，ffmpeg -ss 0 抽帧窗口）
        tl.to("#title-wrap", { scale: 1.04, duration: 0.9, yoyo: true, repeat: 1, ease: "sine.inOut" }, 0.8);
        tl.to(".bd", { scale: 1.07, duration: 0.3, stagger: 0.16, yoyo: true, repeat: 1, ease: "power2.inOut" }, 0.9);
        tl.to("#s1", { x: 900, duration: 1.6, ease: "none" }, 0.8);
        tl.to("#s2", { x: -800, duration: 1.7, ease: "none" }, 0.9);
        tl.to("#s3", { x: 700, duration: 1.5, ease: "none" }, 1.0);
        tl.to("#hero", { filter: "brightness(1.12)", duration: 0.6, yoyo: true, repeat: 2, ease: "sine.inOut" }, 1.0);
        tl.to("#root", { opacity: 0, duration: 0.35 }, 2.65);

        // 渲染器靠 window.__timelines 发现时间线；不注册 = 45s 超时后按静态帧渲染
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
        tl.seek(0);
      </script>
    </div>
  </body>
</html>
